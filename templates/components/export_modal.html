<!-- Export modal — Alpine + HTMX-friendly -->
<div id="export-modal" class="fixed inset-0 z-[60] flex items-center justify-center p-4"
     x-data="exportModal()"
     @cc-open-export-modal.window="openModal()"
     @cc-export-start.window="onExportStart($event)"
     @cc-export-progress.window="onExportProgress($event)"
     @cc-export-complete.window="onExportComplete($event)"
     @cc-export-error.window="onExportError($event)"
     x-show="open" x-cloak
     @keydown.escape.window="open = false">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="open = false"></div>
    <div class="cc-card relative w-full max-w-3xl p-6 z-10">
        <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
            <div>
                <h3 class="text-lg font-semibold text-[var(--cc-text)]">Export Report</h3>
                <p class="text-sm text-[var(--cc-text-muted)] mt-1" x-text="previewReady ? 'Workbook preview ready' : 'Run an analysis or batch first'"></p>
            </div>
            <button type="button" class="cc-btn cc-btn-ghost p-2" @click="open = false" title="Close">x</button>
        </div>

        <div class="grid lg:grid-cols-5 gap-5">
            <div class="lg:col-span-2 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wide text-[var(--cc-text-faint)] mb-2">Profile</label>
                    <select x-model="profile" @change="refreshPreview()" class="cc-input">
                        <option value="full">Full Report</option>
                        <option value="medchem">Medicinal Chemistry</option>
                        <option value="spectroscopy">Spectroscopy</option>
                        <option value="teaching">Teaching</option>
                        <option value="minimal">Minimal</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wide text-[var(--cc-text-faint)] mb-2">Format</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="cc-btn cc-btn-primary" @click="startExport('xlsx')">Excel</button>
                        <button type="button" class="cc-btn cc-btn-ghost" @click="startExport('csv')">CSV</button>
                        <button type="button" class="cc-btn cc-btn-ghost" @click="startExport('json')">JSON</button>
                        <button type="button" class="cc-btn cc-btn-ghost" @click="startExport('markdown')">Markdown</button>
                    </div>
                </div>

                <div x-show="busy || progress > 0" x-cloak>
                    <div class="flex items-center justify-between text-xs text-[var(--cc-text-muted)] mb-2">
                        <span x-text="statusText"></span>
                        <span x-text="progress + '%'"></span>
                    </div>
                    <div class="h-2 rounded-full bg-white/10 overflow-hidden">
                        <div class="h-full bg-indigo-500 transition-all" :style="'width: ' + progress + '%'"></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-4">
                <div class="rounded-lg border border-[var(--cc-border)] p-4">
                    <div class="flex items-center justify-between gap-3 mb-3">
                        <h4 class="text-sm font-semibold text-[var(--cc-text)]">Workbook Preview</h4>
                        <button type="button" class="cc-btn cc-btn-ghost py-1 px-2 text-xs" @click="refreshPreview()">Refresh</button>
                    </div>
                    <template x-if="previewReady">
                        <div class="space-y-3">
                            <div class="grid grid-cols-3 gap-2 text-center">
                                <div class="cc-metric p-3"><p class="cc-metric-label">Records</p><p class="cc-metric-value text-base" x-text="preview.summary.total_records"></p></div>
                                <div class="cc-metric p-3"><p class="cc-metric-label">Success</p><p class="cc-metric-value text-base text-emerald-400" x-text="preview.summary.successful_records"></p></div>
                                <div class="cc-metric p-3"><p class="cc-metric-label">Failed</p><p class="cc-metric-value text-base text-red-400" x-text="preview.summary.failed_records"></p></div>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="sheet in preview.sheets" :key="sheet">
                                    <span class="cc-tag" x-text="sheet"></span>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template x-if="!previewReady">
                        <p class="text-sm text-[var(--cc-text-muted)]">No export data loaded.</p>
                    </template>
                </div>

                <div class="rounded-lg border border-[var(--cc-border)] p-4">
                    <h4 class="text-sm font-semibold text-[var(--cc-text)] mb-3">Export History</h4>
                    <div class="space-y-2 max-h-32 overflow-y-auto">
                        <template x-for="item in history" :key="item.id">
                            <div class="flex items-center justify-between gap-3 text-xs text-[var(--cc-text-muted)]">
                                <span class="truncate" x-text="item.filename"></span>
                                <span class="shrink-0" x-text="item.profile"></span>
                            </div>
                        </template>
                        <p x-show="!history.length" class="text-sm text-[var(--cc-text-muted)]">No exports yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
